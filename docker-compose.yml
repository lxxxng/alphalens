services:
  postgres:
    image: postgres:16
    container_name: alphalens-postgres
    restart: unless-stopped

    environment:
      # PostgreSQL username
      POSTGRES_USER: ${POSTGRES_USER}

      # PostgreSQL password
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      # Database that PostgreSQL creates automatically
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      # Windows port : container port
      #
      # This allows your Python code to connect using:
      # localhost:5432
      - "5432:5432"

    volumes:
      # Store PostgreSQL database files in a Docker volume.
      #
      # This prevents your data from disappearing when the
      # PostgreSQL container is stopped or recreated.
      - alphalens_postgres_data:/var/lib/postgresql/data

    healthcheck:
      # Check whether PostgreSQL is ready to accept connections.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


# ============================================================
# Docker Volumes
# ============================================================
#
# Docker manages this storage separately from the container.
#
# PostgreSQL container
#       ↓
# /var/lib/postgresql/data
#       ↓
# alphalens_postgres_data
#
# Therefore your database survives container recreation.
# ============================================================

volumes:
  alphalens_postgres_data: