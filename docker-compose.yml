services:
  app:
    image: alphalens-api:local
    container_name: alphalens-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The API reads persisted sentiment. A future scheduled-worker image
        # can set this to true to include PyTorch and Transformers.
        INSTALL_ML: "false"
    env_file:
      - .env
    environment:
      # Containers reach each other by Compose service name, not localhost.
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      ALPHALENS_FAISS_DIRECTORY: /app/data/faiss
      ALPHALENS_EVAL_REPORT_DIRECTORY: /app/data/evals
    ports:
      - "8000:8000"
    volumes:
      # Keep large mutable retrieval indexes and reports outside the image.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4

  postgres:
    image: postgres:16
    container_name: alphalens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Keep host access for PowerShell scripts and local development.
      - "5432:5432"
    volumes:
      - alphalens_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  alphalens_postgres_data:
