name: AlphaLens CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older run irrelevant and avoids spending judge calls
# on a commit that can no longer be merged.
concurrency:
  group: alphalens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app evals pipelines tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  corpus-quality:
    name: Corpus quality gate
    needs: unit-tests
    runs-on: [self-hosted, Windows, X64, alphalens-evals]
    environment: corpus-evals
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ALPHALENS_FAISS_DIRECTORY: ${{ vars.ALPHALENS_FAISS_DIRECTORY }}
      RAG_MODEL: ${{ vars.RAG_MODEL || 'gpt-5-mini' }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'gpt-5-mini' }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run corpus-backed quality gate
        shell: pwsh
        run: ./scripts/run_quality_gate.ps1 -SkipUnitTests

      # Reports are useful even when a threshold fails. They show the exact
      # case, deterministic check, and model-judge reason behind the failure.
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-reports-${{ github.run_id }}
          path: data/evals/*.json
          if-no-files-found: warn
          retention-days: 30
