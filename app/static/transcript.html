<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlphaLens Transcript</title>
    <link rel="stylesheet" href="/static/transcript.css?v=20260910.1">
    <link rel="stylesheet" href="/static/navigation.css?v=20260910.1">
  </head>
  <body>
    <header class="app-header">
      <div class="app-header-inner">
        <a class="product-lockup" href="/" aria-label="AlphaLens research home">
          <span class="product-mark" aria-hidden="true">A</span>
          <span>
            <strong>AlphaLens</strong>
            <small>Research Intelligence</small>
          </span>
        </a>
        <nav class="global-nav" aria-label="Application navigation">
          <a class="nav-link active" href="/">Research</a>
          <a class="nav-link" href="/evals">Evaluations</a>
          <a class="nav-link" href="/docs">API</a>
        </nav>
      </div>
    </header>

    <main class="transcript-shell">
      <section class="transcript-heading">
        <div>
          <p class="eyebrow">Earnings Transcript</p>
          <h1 id="transcript-title">Loading transcript</h1>
          <p id="transcript-subtitle" class="transcript-subtitle"></p>
        </div>
        <a id="research-link" class="research-link" href="/">Research</a>
      </section>

      <section id="transcript-facts" class="transcript-facts" aria-label="Transcript summary"></section>

      <section class="transcript-toolbar" aria-label="Transcript tools">
        <label class="transcript-search">
          <span>Search transcript</span>
          <input id="transcript-search" type="search" placeholder="Search speakers or text">
        </label>
        <span id="turn-count" class="turn-count">Loading</span>
        <button id="copy-transcript" type="button" disabled>Copy</button>
      </section>

      <section id="transcript-error" class="transcript-error" hidden></section>
      <section id="transcript-turns" class="transcript-turns" aria-live="polite"></section>
    </main>

    <script src="/static/transcript.js?v=20260910.1"></script>
  </body>
</html>
