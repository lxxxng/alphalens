<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AlphaLens Research</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="shell">
      <!-- Query controls stay separate from results so the user can tune a
           search without losing sight of the answer. -->
      <section class="query-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">AlphaLens</p>
            <h1 id="app-title">Research Console</h1>
          </div>
          <div class="brand-actions">
            <button
              id="openai-health"
              class="connection-status checking"
              type="button"
              title="Check OpenAI connection"
              aria-live="polite"
            >
              <span class="connection-dot" aria-hidden="true"></span>
              <span id="openai-health-label">OpenAI: Checking</span>
            </button>
            <a class="docs-link" href="/docs">API Docs</a>
          </div>
        </div>

        <form id="research-form" class="research-form">
          <div class="question-row">
            <label class="field-label" for="question">Question</label>
            <button id="sample-button" class="ghost-button" type="button">
              Sample
            </button>
          </div>
          <textarea
            id="question"
            name="question"
            rows="7"
            required
          >What did Walmart management say about margins on the earnings call?</textarea>

          <div class="control-grid">
            <label class="control">
              <span>Ticker</span>
              <select
                id="ticker"
                name="ticker"
              >
                <option value="WMT">WMT</option>
                <option value="NVDA">NVDA</option>
              </select>
            </label>

            <label class="control">
              <span>Fiscal Period</span>
              <select
                id="fiscal-period"
                name="fiscal_period"
              >
                <option value="">Latest</option>
              </select>
            </label>

            <label class="control">
              <span>Filing Type</span>
              <select
                id="form-type"
                name="form_type"
              >
                <option value="">Any</option>
              </select>
            </label>

            <label class="control wide">
              <span>Section</span>
              <select
                id="section-key"
                name="section_key"
              >
                <option value="">Any</option>
              </select>
            </label>

            <label class="control">
              <span>Top K</span>
              <input
                id="top-k"
                name="top_k"
                type="number"
                min="1"
                max="20"
                value="3"
              >
            </label>
          </div>

          <fieldset class="source-picker">
            <legend>Sources</legend>
            <label>
              <input type="radio" name="source_type" value="auto">
              <span>Auto</span>
            </label>
            <label>
              <input type="radio" name="source_type" value="filings">
              <span>Filings</span>
            </label>
            <label>
              <input type="radio" name="source_type" value="transcripts" checked>
              <span>Transcripts</span>
            </label>
            <label>
              <input type="radio" name="source_type" value="both">
              <span>Both</span>
            </label>
          </fieldset>

          <div class="form-actions">
            <button id="submit-button" class="primary-button" type="submit">
              Search
            </button>
            <button id="preview-button" class="secondary-button" type="button">
              Preview Evidence
            </button>
          </div>
        </form>
      </section>

      <!-- The answer pane is intentionally source-first: every generated
           claim should be traceable back to an expandable citation card. -->
      <section class="answer-panel" aria-live="polite">
        <div class="answer-header">
          <div>
            <p class="eyebrow">Answer</p>
            <h2 id="result-title">Ready</h2>
          </div>
          <div class="answer-actions">
            <button id="copy-button" class="ghost-button" type="button">
              Copy
            </button>
            <span id="status-pill" class="status-pill">Idle</span>
          </div>
        </div>

        <article id="answer" class="answer-text">Ask a question to search SEC filings, earnings call transcripts, or both.</article>

        <section class="price-chart-panel" aria-labelledby="price-chart-title">
          <div class="chart-header">
            <div>
              <p class="eyebrow">Market Data</p>
              <h3 id="price-chart-title">Price Performance</h3>
            </div>
            <div class="range-picker" aria-label="Chart period">
              <button type="button" data-period="1M" aria-pressed="false">1M</button>
              <button type="button" data-period="3M" aria-pressed="false">3M</button>
              <button type="button" data-period="1Y" class="active" aria-pressed="true">1Y</button>
              <button type="button" data-period="5Y" aria-pressed="false">5Y</button>
            </div>
          </div>
          <div class="chart-summary">
            <strong id="chart-ticker">WMT</strong>
            <span id="chart-period-return">Loading prices...</span>
            <span id="chart-date-range"></span>
          </div>
          <div id="price-chart" class="price-chart" aria-live="polite">
            <svg
              id="price-chart-svg"
              role="img"
              aria-label="Indexed stock performance chart"
            ></svg>
            <div id="chart-tooltip" class="chart-tooltip" hidden></div>
            <p id="chart-empty" class="chart-empty">Loading market data...</p>
          </div>
          <div id="chart-legend" class="chart-legend"></div>
        </section>

        <section id="market-panel" class="market-panel" hidden>
          <div class="sources-header">
            <h3>Market Snapshot</h3>
            <span id="market-count">0</span>
          </div>
          <div id="market-snapshots" class="market-grid"></div>
        </section>

        <div class="sources-header">
          <h3>Sources</h3>
          <span id="source-count">0</span>
        </div>
        <div id="sources" class="sources-list"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
